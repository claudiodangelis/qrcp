name: CI
on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  pull_request:
permissions:
  contents: write
env:
  GOLANG_VERSION: 1.21.x
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.0
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -v ./...
      - name: Test with the Go CLI
        run: go test ./...
  e2e:
    needs: [ test, lint ]
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one system doesn't hide the results of the others
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Run tests on *nix
        if: runner.os != 'Windows'
        run: |
          TEST_CONTENT="hello"
          TEST_FILE="/tmp/qrcp-test.txt"
          echo $TEST_CONTENT > $TEST_FILE
          go build
          OS=$(uname)
          INTERFACE=lo
          if [[ "$OS" == "Darwin" ]]; then
              INTERFACE="lo0"
          fi
          ./qrcp -i $INTERFACE -p 1606 --path test $TEST_FILE > /dev/null 2>&1 &
          QRCP_PID=$!
          sleep 2
          CURL_OUTPUT=$(curl -s http://127.0.0.1:1606/send/test)
          kill $QRCP_PID || true
          if [[ "${TEST_CONTENT}" != "${CURL_OUTPUT}" ]]; then
              exit 1
          fi
      - name: Check --scheme and --with-name on *nix
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: |
          go build
          INTERFACE=lo
          if [[ "$(uname)" == "Darwin" ]]; then
              INTERFACE=lo0
          fi
          TEST_FILE="/tmp/watch face.zpk"
          echo hello > "$TEST_FILE"
          ./qrcp -i $INTERFACE -p 1608 --path test --scheme zpkd1 -w "$TEST_FILE" > qrcp.out 2>&1 &
          QRCP_PID=$!
          sleep 2
          URL=$(grep -o 'zpkd1://[^ ]*' qrcp.out | head -1)
          if [[ "$URL" != "zpkd1://127.0.0.1:1608/send/test/watch%20face.zpk" ]]; then
              kill $QRCP_PID || true
              cat qrcp.out
              echo "unexpected URL: $URL"
              exit 1
          fi
          # The server still uses http
          CURL_OUTPUT=$(curl -s "http://${URL#zpkd1://}")
          kill $QRCP_PID || true
          if [[ "$CURL_OUTPUT" != "hello" ]]; then
              echo "unexpected content: $CURL_OUTPUT"
              exit 1
          fi
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: |
          $TestContent = "hello"
          $TestFile = "$env:TEMP\qrcp-test.txt"
          $TestContent | Out-File -FilePath $TestFile -Encoding UTF8
          go build
          $Job = Start-Job -ScriptBlock {
              Start-Process -FilePath ./qrcp -ArgumentList "-i", "any", "-p", "1606", "--path", "test", "$env:TEMP\qrcp-test.txt" -NoNewWindow -Wait
          }
          Start-Sleep -Seconds 2
          $Request = Invoke-WebRequest -Uri http://127.0.0.1:1606/send/test
          $FileContent = Get-Content -Path $TestFile -Raw
          if ($Request.Content -ne $FileContent) {
              Write-Host "Expected: $FileContent"
              Write-Host "Got: $($Request.Content)"
              exit 1
          }
      - name: Check qrcp doctor on *nix
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: |
          go build
          # The whole report from a real machine, for the log
          set +e
          ./qrcp doctor --json > doctor.json
          CODE=$?
          set -e
          cat doctor.json
          FAILED=$(jq -r .failed doctor.json)
          if [[ "$FAILED" == "true" && $CODE != 1 ]] || [[ "$FAILED" == "false" && $CODE != 0 ]]; then
              echo "exit code $CODE doesn't match failed=$FAILED"
              exit 1
          fi
          FIREWALL=$(jq -r '.checks[] | select(.name == "firewall") | .message' doctor.json)
          if [[ -z "$FIREWALL" || "$FIREWALL" == "unable to tell whether a firewall is active" ]]; then
              echo "the firewall state wasn't determined: $FIREWALL"
              exit 1
          fi
          # Add a second address to the interface of the default route, and
          # check that --bind to each of its addresses doesn't warn or fail
          if [[ "$(uname)" == "Darwin" ]]; then
              IFACE=$(route -n get default | awk '/interface:/ {print $2}')
              sudo ifconfig "$IFACE" alias 10.99.99.2 255.255.255.255
              ADDRESSES=$(ifconfig "$IFACE" | awk '$1 == "inet" {print $2}')
          else
              IFACE=$(ip route show default | awk '{print $5; exit}')
              sudo ip addr add 10.99.99.2/32 dev "$IFACE"
              ADDRESSES=$(ip -4 -o addr show dev "$IFACE" | awk '{split($4, a, "/"); print a[1]}')
          fi
          for ADDRESS in $ADDRESSES; do
              ./qrcp doctor --json -i "$IFACE" --bind "$ADDRESS" -p 1607 > bind.json || true
              cat bind.json
              PORT=$(jq -r '.checks[] | select(.name == "port") | .status' bind.json)
              if [[ "$PORT" != "ok" && "$PORT" != "info" ]]; then
                  echo "the port check is '$PORT' for --bind $ADDRESS, an address of $IFACE"
                  exit 1
              fi
          done
      - name: Check qrcp doctor on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          go build
          # The PowerShell query doctor runs, on its own
          $Time = Measure-Command {
              $Out = powershell -NoProfile -NonInteractive -Command "`$ProgressPreference = 'SilentlyContinue'; (Get-NetFirewallProfile | Where-Object { `$_.Enabled }).Count"
          }
          Write-Host "enabled firewall profiles: $Out (in $($Time.TotalSeconds)s)"
          # The whole report from a real machine, for the log
          ./qrcp doctor --json > doctor.json
          $Code = $LASTEXITCODE
          Get-Content doctor.json
          $Report = Get-Content doctor.json -Raw | ConvertFrom-Json
          if (($Report.failed -and $Code -ne 1) -or (-not $Report.failed -and $Code -ne 0)) {
              throw "exit code $Code doesn't match failed=$($Report.failed)"
          }
          $Firewall = ($Report.checks | Where-Object name -eq 'firewall').message
          if (-not $Firewall -or $Firewall -eq 'unable to tell whether a firewall is active') {
              throw "the firewall state wasn't determined: $Firewall"
          }
          exit 0
      # A separate step, so that the log of the previous one is kept if
      # changing the network goes wrong
      - name: Check qrcp doctor --bind on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          # Add a second address to the interface of the default route, and
          # check that --bind to each of its addresses doesn't warn or fail.
          # It's an IPv6 one: a static IPv4 address would turn DHCP off and
          # disconnect the runner, while IPv6 addresses add up. qrcp reports
          # the IPv4 address of the interface, so this one is the second.
          $Iface = (Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Sort-Object RouteMetric | Select-Object -First 1).InterfaceAlias
          New-NetIPAddress -InterfaceAlias $Iface -AddressFamily IPv6 -IPAddress fd00:99::2 -PrefixLength 128 -SkipAsSource $true | Out-Null
          for ($i = 0; $i -lt 30 -and (Get-NetIPAddress -IPAddress fd00:99::2).AddressState -ne 'Preferred'; $i++) {
              Start-Sleep -Seconds 1
          }
          Get-NetIPAddress -InterfaceAlias $Iface | Format-Table IPAddress, AddressFamily, AddressState, PrefixOrigin
          $Addresses = @('[fd00:99::2]') + (Get-NetIPAddress -InterfaceAlias $Iface -AddressFamily IPv4).IPAddress
          foreach ($Address in $Addresses) {
              ./qrcp doctor --json -i $Iface --bind $Address -p 1607 > bind.json
              Get-Content bind.json
              $Port = ((Get-Content bind.json -Raw | ConvertFrom-Json).checks | Where-Object name -eq 'port').status
              if ($Port -ne 'ok' -and $Port -ne 'info') {
                  throw "the port check is '$Port' for --bind $Address, an address of $Iface"
              }
          }
          exit 0
  release:
    runs-on: ubuntu-24.04
    needs: [ e2e ]
    if: startsWith(github.event.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4

    - name: Unshallow
      run: git fetch --prune --unshallow

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GOLANG_VERSION }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        args: release --clean
        version: '~> v2'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
