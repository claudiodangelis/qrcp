<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qrcp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: #e6f4ea;
            border-radius: 50%;
            margin: 0 auto 20px;
            font-size: 32px;
        }
        h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; line-height: 1.6; }
        .filename {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            background: #f5f5f5;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #333;
            word-break: break-all;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">&#10003;</div>
        <h1>Transfer complete</h1>
        <p>You can close this page now.</p>
        <div class="filename">{{.File}}</div>
    </div>
</body>
</html>
