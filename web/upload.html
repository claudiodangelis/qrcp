<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qrcp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 0;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.07);
            border: 1px solid #eaecef;
            overflow: hidden;
        }
        .brand {
            padding: 36px 40px 32px;
            border-bottom: 1px solid #eaecef;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }
        .brand-name {
            font-size: 15px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .content { padding: 32px 40px 40px; }
        .content-title {
            font-size: 15px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 24px;
        }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        input[type=file] {
            display: block;
            width: 100%;
            font-size: 13.5px;
            color: #374151;
            padding: 8px 0;
        }
        input[type=text], textarea {
            display: block;
            width: 100%;
            padding: 9px 12px;
            font-size: 13.5px;
            font-family: inherit;
            color: #111827;
            background: #fafafa;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type=text]:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
            background: #fff;
        }
        textarea { min-height: 90px; resize: vertical; }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .toggle-row input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; accent-color: #2563eb; }
        .toggle-row label { margin: 0; font-size: 13px; color: #4b5563; cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 400; }
        #pasted-file-container { margin-bottom: 8px; }
        .pasted-file-wrapper {
            display: inline-block;
            margin: 4px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .pasted-file-wrapper img { display: block; max-width: 110px; max-height: 110px; object-fit: cover; }
        .file-info { display: flex; align-items: center; gap: 6px; padding: 7px 10px; }
        .file-icon { color: #9ca3af; display: flex; align-items: center; }
        .file-name { font-size: 12.5px; color: #4b5563; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .divider { height: 1px; background: #f0f0f0; margin: 20px 0; }
        input[type=submit] {
            display: block;
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
            letter-spacing: 0.01em;
        }
        input[type=submit]:hover:not(:disabled) { background: #1d4ed8; }
        input[type=submit]:disabled { background: #93c5fd; cursor: not-allowed; }
        #progress-container { margin-top: 14px; }
        progress {
            display: block;
            width: 100%;
            height: 4px;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            border-radius: 2px;
            overflow: hidden;
            background: #e5e7eb;
            margin-bottom: 6px;
        }
        progress::-webkit-progress-bar { background: #e5e7eb; border-radius: 2px; }
        progress::-webkit-progress-value { background: #2563eb; border-radius: 2px; transition: width 0.1s; }
        progress::-moz-progress-bar { background: #2563eb; border-radius: 2px; }
        #upload-percent { font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg height="72" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 804.666 306.14" xml:space="preserve"><g><g><polygon fill="#00AEEF" points="246.355 182.111 82.612 290.467 82.688 198.443 254.354 116.233"/></g><g><g><g><g><polygon fill="#F9ED32" points="31.388 227.121 154.208 165.906 158.21 181.887 250.908 132.033 250.911 171.207 386.376 31.251 284.368 75.32 284.368 37.369 195.419 82.664 177.044 36.152 31.388 91.638"/></g><g><path fill="#231F20" d="M26.388,235.199V88.193L179.88,29.721l18.17,45.992l91.318-46.502v38.502l118.027-50.989 L245.912,183.561l-0.003-43.162l-90.988,48.933l-4.052-16.176L26.388,235.199z M36.388,95.084v123.957l121.159-60.387 l3.952,15.785l94.408-50.773l0.003,35.185L365.356,45.779l-85.988,37.147v-37.4l-86.58,44.088l-18.58-47.031L36.388,95.084z"/></g></g></g></g><g><g><g><path fill="#00AEEF" d="M217.093,114.078c0,7.662-5.496,15.098-11.062,17.955c-5.566,2.861-8.879,3.879-13.932,4.084 c-5.045,0.205-13.875-6.209-13.875-13.871V35.968c0-7.66,6.214-13.871,13.875-13.871h11.122c7.661,0,13.872,6.211,13.872,13.871 V114.078z"/></g></g><g><g><path fill="#231F20" d="M191.862,141.427c-8.348,0-18.938-9.035-18.938-19.182V35.968c0-10.574,8.604-19.18,19.174-19.18h11.122 c10.575,0,19.177,8.605,19.177,19.18v78.109c0,10.186-7.014,19.117-13.945,22.678c-6.338,3.254-10.411,4.43-16.136,4.662 C192.162,141.421,192.015,141.427,191.862,141.427z M192.099,27.4c-4.723,0-8.565,3.844-8.565,8.568v86.277 c0,4.402,6.062,8.57,8.329,8.57h0.021c4.183-0.168,6.7-0.922,11.721-3.5c3.939-2.02,8.189-7.654,8.189-13.238V35.968 c0-4.725-3.849-8.568-8.573-8.568H192.099z"/></g></g></g><g><g><g><path fill="#00AEEF" d="M258.661,93.66c0,7.914-2.922,13.332-7.207,17.977c-4.081,4.428-10.127,9.779-17.783,9.779 c-7.662,0-13.875-6.211-13.875-13.871V45.755c0-7.66,6.213-13.871,13.875-13.871h11.121c7.661,0,13.869,6.211,13.869,13.871 V93.66z"/></g></g><g><g><path fill="#231F20" d="M233.671,126.718c-10.576,0-19.178-8.605-19.178-19.174V45.755c0-10.568,8.602-19.174,19.178-19.174 h11.121c10.574,0,19.178,8.605,19.178,19.174V93.66c0,8.346-2.738,15.199-8.615,21.572 C252.731,118.074,244.761,126.718,233.671,126.718z M233.671,37.193c-4.725,0-8.568,3.846-8.568,8.562v61.789 c0,4.725,3.844,8.562,8.568,8.562c4.397,0,8.809-2.562,13.885-8.066c4.066-4.41,5.803-8.713,5.803-14.381V45.755 c0-4.717-3.841-8.562-8.566-8.562H233.671z"/></g></g></g><g><g><g><path fill="#00AEEF" d="M175.526,128.376c0,7.66-6.21,13.873-13.879,13.873H150.53c-7.661,0-13.871-6.213-13.871-13.873V33.933 c0-7.66,6.21-13.871,13.871-13.871h11.117c7.669,0,13.879,6.211,13.879,13.871V128.376z"/></g></g><g><g><path fill="#231F20" d="M161.647,147.554H150.53c-10.57,0-19.174-8.605-19.174-19.178V33.933c0-10.572,8.604-19.18,19.174-19.18 h11.117c10.58,0,19.182,8.607,19.182,19.18v94.443C180.829,138.949,172.228,147.554,161.647,147.554z M150.53,25.363 c-4.725,0-8.566,3.848-8.566,8.57v94.443c0,4.725,3.842,8.568,8.566,8.568h11.117c4.729,0,8.574-3.844,8.574-8.568V33.933 c0-4.723-3.846-8.57-8.574-8.57H150.53z"/></g></g></g><g><g><g><path fill="#00AEEF" d="M133.958,115.712c0,7.66-6.211,13.871-13.871,13.871h-8.676c-7.66,0-13.87-6.211-13.87-13.871V45.771 c0-7.662,6.21-13.873,13.87-13.873h8.676c7.66,0,13.871,6.211,13.871,13.873V115.712z"/></g></g><g><g><path fill="#231F20" d="M120.087,134.884h-8.676c-10.57,0-19.174-8.6-19.174-19.172V45.771c0-10.576,8.604-19.182,19.174-19.182 h8.676c10.572,0,19.174,8.605,19.174,19.182v69.941C139.261,126.285,130.659,134.884,120.087,134.884z M111.411,37.201 c-4.721,0-8.566,3.842-8.566,8.57v69.941c0,4.725,3.846,8.568,8.566,8.568h8.676c4.721,0,8.565-3.844,8.565-8.568V45.771 c0-4.729-3.845-8.57-8.565-8.57H111.411z"/></g></g></g><g><g><g><path fill="#00AEEF" d="M83.612,222.221V108.378l85.373-53.645c0,0,14.189,23.855-2.943,41.402 c-17.142,17.547-29.383,22.033-29.383,22.033s29.383,29.385,21.627,67.336"/></g></g><g><g><path fill="#231F20" d="M83.612,291.561c-2.929,0-5.305-2.373-5.305-5.303V105.445l92.459-58.098l2.777,4.676 c5.627,9.463,12.094,31.637-3.71,47.816c-10.362,10.605-19.106,16.703-24.712,19.971c8.459,10.633,24.678,35.84,18.361,66.758 c-0.586,2.867-3.387,4.719-6.258,4.135c-2.869-0.584-4.721-3.393-4.135-6.26c7.097-34.756-19.906-62.254-20.182-62.524 l-5.873-5.877l7.795-2.855c0.092-0.031,11.52-4.488,27.412-20.758c5.785-5.92,7.975-13.449,6.52-22.369 c-0.478-2.912-1.277-5.531-2.062-7.627L88.918,111.31v174.948C88.918,289.188,86.542,291.561,83.612,291.561z"/></g></g></g></g></svg>
            <span class="brand-name">qrcp</span>
        </div>
        <div class="content">
            <p class="content-title">Send files or text</p>
            <form id="upload-form">
                <div class="field">
                    <label for="files">Files</label>
                    <input type="file" id="files" name="files" multiple>
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="check-send-text">
                    <label for="check-send-text">Include text or pasted content</label>
                </div>
                <div id="send-text-form" style="display:none">
                    <div class="field">
                        <label for="plaintext-title">Title</label>
                        <input type="text" id="plaintext-title" placeholder="Optional filename (without .txt)">
                    </div>
                    <div class="field">
                        <label for="plaintext-text">Text</label>
                        <textarea id="plaintext-text" placeholder="Type or paste text here"></textarea>
                    </div>
                </div>
                <div id="pasted-file-container"></div>
                <input type="submit" id="submit" name="submit" value="Transfer">
                <div id="progress-container" style="display:none">
                    <progress id="upload-progress" value="0" max="100"></progress>
                    <span id="upload-percent">0%</span>
                </div>
            </form>
        </div>
    </div>
    <script>
        var textCheckbox = document.getElementById('check-send-text');
        var textForm = document.getElementById('send-text-form');
        textCheckbox.addEventListener('change', function() {
            textForm.style.display = this.checked ? 'block' : 'none';
        });
    </script>
    <script>
        var uploadForm = document.getElementById('upload-form');
        var pastedFiles = [];
        var textArea = document.getElementById('plaintext-text');
        var pastedFileContainer = document.getElementById('pasted-file-container');

        textArea.addEventListener('paste', function(e) {
            var clipboardData = e.clipboardData || window.clipboardData;
            var items = clipboardData.items;
            var foundFile = false;

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                if (item.kind === 'file') {
                    var blob = item.getAsFile();
                    foundFile = true;
                    e.preventDefault();
                    pastedFiles.push(blob);

                    var fileWrapper = document.createElement('div');
                    fileWrapper.className = 'pasted-file-wrapper';

                    if (blob.type.startsWith('image/')) {
                        var img = document.createElement('img');
                        img.src = URL.createObjectURL(blob);
                        fileWrapper.appendChild(img);
                    } else {
                        var fileInfo = document.createElement('div');
                        fileInfo.className = 'file-info';

                        var fileIcon = document.createElement('span');
                        fileIcon.className = 'file-icon';
                        fileIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';

                        var fileName = document.createElement('span');
                        fileName.className = 'file-name';
                        fileName.textContent = blob.name || 'Pasted file';

                        fileInfo.appendChild(fileIcon);
                        fileInfo.appendChild(fileName);
                        fileWrapper.appendChild(fileInfo);
                    }

                    pastedFileContainer.appendChild(fileWrapper);
                }
            }

            if (foundFile) {
                e.preventDefault();
            }
        });

        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            var submitBtn = document.getElementById('submit');
            submitBtn.value = 'Transferring...';
            submitBtn.disabled = true;

            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    document.write(xhr.response);
                }
            };
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round(e.loaded / e.total * 100);
                    document.getElementById('upload-progress').value = pct;
                    document.getElementById('upload-percent').textContent = pct + '%';
                    document.getElementById('progress-container').style.display = '';
                }
            };

            var formData = new FormData(uploadForm);
            var titleInput = document.getElementById('plaintext-title');
            var textInput = document.getElementById('plaintext-text');
            var textCheckbox = document.getElementById('check-send-text');

            if ((titleInput.value || textInput.value) && textCheckbox.checked) {
                var currentDate = new Date().toJSON().slice(0, 19).replace(/[-T:]/g, '_');
                var filename = titleInput.value || ('qrcp-text-file-' + currentDate);
                var blob = new Blob([textInput.value + '\n'], { type: 'text/plain' });
                formData.append('textFile', blob, filename + '.txt');
            }

            for (var i = 0; i < pastedFiles.length; i++) {
                var file = pastedFiles[i];
                var fileName = file.name || ('pasted_file_' + i);
                formData.append('files', file, fileName);
            }

            xhr.open('POST', '{{.Route}}');
            xhr.send(formData);
        });
    </script>
</body>
</html>
