<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qrcp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon { font-size: 48px; display: block; text-align: center; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 28px; text-align: center; }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
        input[type=file] {
            display: block;
            width: 100%;
            font-size: 14px;
            color: #333;
            padding: 8px 0;
        }
        input[type=text], textarea {
            display: block;
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color: #1a1a1a;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type=text]:focus, textarea:focus {
            border-color: #0066ff;
            background: #fff;
        }
        textarea { min-height: 100px; resize: vertical; }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            cursor: pointer;
        }
        .checkbox-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
        .checkbox-row label { margin: 0; font-size: 14px; color: #444; cursor: pointer; }
        #pasted-file-container { margin-bottom: 8px; }
        .pasted-file-wrapper {
            display: inline-block;
            margin: 4px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            background: #fafafa;
        }
        .pasted-file-wrapper img { display: block; max-width: 120px; max-height: 120px; object-fit: cover; }
        .file-info { display: flex; align-items: center; gap: 6px; padding: 8px 12px; }
        .file-icon { font-size: 18px; }
        .file-name { font-size: 13px; color: #444; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        input[type=submit] {
            display: block;
            width: 100%;
            padding: 13px;
            background: #0066ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        input[type=submit]:hover:not(:disabled) { background: #0052cc; }
        input[type=submit]:disabled { background: #99bbff; cursor: not-allowed; }
        #progress-container { margin-top: 16px; }
        progress {
            display: block;
            width: 100%;
            height: 6px;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            border-radius: 3px;
            overflow: hidden;
            background: #e8eaf0;
            margin-bottom: 6px;
        }
        progress::-webkit-progress-bar { background: #e8eaf0; border-radius: 3px; }
        progress::-webkit-progress-value { background: #0066ff; border-radius: 3px; transition: width 0.1s; }
        progress::-moz-progress-bar { background: #0066ff; border-radius: 3px; }
        #upload-percent { font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">&#128228;</span>
        <h1>Send files or text</h1>
        <form id="upload-form">
            <div class="field">
                <label for="files">Files to transfer</label>
                <input type="file" id="files" name="files" multiple>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="check-send-text">
                <label for="check-send-text">Show text and paste options</label>
            </div>
            <div id="send-text-form" style="display:none">
                <div class="field">
                    <label for="plaintext-title">Title</label>
                    <input type="text" id="plaintext-title" placeholder="Optional filename (without .txt)">
                </div>
                <div class="field">
                    <label for="plaintext-text">Text (you can paste files here)</label>
                    <textarea id="plaintext-text" placeholder="Write text or paste files here"></textarea>
                </div>
            </div>
            <div id="pasted-file-container"></div>
            <input type="submit" id="submit" name="submit" value="Transfer">
            <div id="progress-container" style="display:none">
                <progress id="upload-progress" value="0" max="100"></progress>
                <span id="upload-percent">0%</span>
            </div>
        </form>
    </div>
    <script>
        var textCheckbox = document.getElementById('check-send-text');
        var textForm = document.getElementById('send-text-form');
        textCheckbox.addEventListener('change', function() {
            textForm.style.display = this.checked ? 'block' : 'none';
        });
    </script>
    <script>
        var uploadForm = document.getElementById('upload-form');
        var pastedFiles = [];
        var textArea = document.getElementById('plaintext-text');
        var pastedFileContainer = document.getElementById('pasted-file-container');

        textArea.addEventListener('paste', function(e) {
            var clipboardData = e.clipboardData || window.clipboardData;
            var items = clipboardData.items;
            var foundFile = false;

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                if (item.kind === 'file') {
                    var blob = item.getAsFile();
                    foundFile = true;
                    e.preventDefault();
                    pastedFiles.push(blob);

                    var fileWrapper = document.createElement('div');
                    fileWrapper.className = 'pasted-file-wrapper';

                    if (blob.type.startsWith('image/')) {
                        var img = document.createElement('img');
                        img.src = URL.createObjectURL(blob);
                        fileWrapper.appendChild(img);
                    } else {
                        var fileInfo = document.createElement('div');
                        fileInfo.className = 'file-info';

                        var fileIcon = document.createElement('span');
                        fileIcon.className = 'file-icon';
                        fileIcon.innerHTML = '&#128196;';

                        var fileName = document.createElement('span');
                        fileName.className = 'file-name';
                        fileName.textContent = blob.name || 'Pasted file';

                        fileInfo.appendChild(fileIcon);
                        fileInfo.appendChild(fileName);
                        fileWrapper.appendChild(fileInfo);
                    }

                    pastedFileContainer.appendChild(fileWrapper);
                }
            }

            if (foundFile) {
                e.preventDefault();
            }
        });

        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            var submitBtn = document.getElementById('submit');
            submitBtn.value = 'Transferring…';
            submitBtn.disabled = true;

            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    document.write(xhr.response);
                }
            };
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round(e.loaded / e.total * 100);
                    document.getElementById('upload-progress').value = pct;
                    document.getElementById('upload-percent').textContent = pct + '%';
                    document.getElementById('progress-container').style.display = '';
                }
            };

            var formData = new FormData(uploadForm);
            var titleInput = document.getElementById('plaintext-title');
            var textInput = document.getElementById('plaintext-text');
            var textCheckbox = document.getElementById('check-send-text');

            if ((titleInput.value || textInput.value) && textCheckbox.checked) {
                var currentDate = new Date().toJSON().slice(0, 19).replace(/[-T:]/g, '_');
                var filename = titleInput.value || ('qrcp-text-file-' + currentDate);
                var blob = new Blob([textInput.value + '\n'], { type: 'text/plain' });
                formData.append('textFile', blob, filename + '.txt');
            }

            for (var i = 0; i < pastedFiles.length; i++) {
                var file = pastedFiles[i];
                var fileName = file.name || ('pasted_file_' + i);
                formData.append('files', file, fileName);
            }

            xhr.open('POST', '{{.Route}}');
            xhr.send(formData);
        });
    </script>
</body>
</html>
