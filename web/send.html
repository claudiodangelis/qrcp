<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qrcp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon { font-size: 56px; margin-bottom: 20px; display: block; }
        h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; line-height: 1.6; }
        .filename {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background: #f5f5f5;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            word-break: break-all;
            max-width: 100%;
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #e0e0e0;
            border-top-color: #0066ff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: #e6f4ea;
            border-radius: 50%;
            margin: 0 auto 20px;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="state-starting">
            <span class="icon">&#128229;</span>
            <div class="spinner"></div>
            <h1>Starting download&hellip;</h1>
            <p>Your file transfer is being prepared.</p>
            <div class="filename">{{.Filename}}</div>
        </div>
        <div id="state-done" class="hidden">
            <div class="check">&#10003;</div>
            <h1>Download started</h1>
            <p>You can close this page once the download completes.</p>
            <div class="filename">{{.Filename}}</div>
        </div>
    </div>
    <script>
        (function () {
            var a = document.createElement('a');
            a.href = '{{.DownloadURL}}';
            a.download = '{{.Filename}}';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(function () {
                document.getElementById('state-starting').classList.add('hidden');
                document.getElementById('state-done').classList.remove('hidden');
            }, 1500);
        })();
    </script>
</body>
</html>
